<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02-product-landing</title>
    <link rel="stylesheet" href="../01-linear-calculators/css/style.css" />
  </head>
  <body>
    <main id="main-content">
      <h1>02-product-landing</h1>
      <!-- З клавіатури вводяться імена двох дітей та кількість у них цукерок. Вивести не екран ім’я тієї дитини, у якої кількість цукерок є більшою, або вивести, що кількість однакова. -->
      <div class="calc">
        <h2>2. Цукерки</h2>
        <input type="text" id="child1" placeholder="Ім'я першої дитини" />
        <input type="number" id="candies1" placeholder="Кількість цукерок 1" />
        <input type="text" id="child2" placeholder="Ім'я другої дитини" />
        <input type="number" id="candies2" placeholder="Кількість цукерок 2" />
        <button onclick="compareCandies()">Порівняти</button>
        <div class="result" id="res2"></div>
      </div>
    </main>
    <div id="main-no-content">
      <h3>Вхід заборонено ❌</h3>
    </div>

      <h2>🛒 Кошик магазину</h2>

    <div class="container">
      <h1>🛒 Кошик магазину</h1>

      <label>
        Ціна товару (грн):
        <input type="number" id="price" value="500" />
      </label>

      <label>
        Кількість:
        <input type="number" id="quantity" value="2" />
      </label>

      <label>
        Виберіть доставку:
        <select id="deliveryType">
          <option value="nova">Нова Пошта</option>
          <option value="ukr">Укрпошта</option>
          <option value="courier">Кур’єр</option>
          <option value="pickup">Самовивіз</option>
        </select>
      </label>

      <button id="calcBtn">Розрахувати</button>

      <div class="result">
        <p id="total"></p>
        <p id="delivery"></p>
      </div>
    </div>

    <h2>Оберіть смайлик:</h2>
    <p>1. Веселий<br />2. Сумний<br />3. Обурений</p>

    <input type="number" id="choice" placeholder="Введіть число (1-3)" />
    <button onclick="showSmile()">Показати</button>

    <h2>🎲 Гра в кості</h2>
    <p>
      Правила: <br />
      1) Можна кинути кубик до 2 разів.<br />
      2) Парне число ➝ додає бали.<br />
      3) Непарне ➝ віднімає бали.<br />
      4) Виграє той, у кого більше балів.
    </p>

    <button onclick="rollDice()">🎲 Кинути кубик</button>
    <button onclick="finishGame()">🏁 Завершити гру</button>

    <div class="result" id="gameResult"></div>

    <div id="result"></div>
    <script src="./js/script.js"></script>
  </body>
</html>
